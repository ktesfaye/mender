<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mender</title>
    <!-- The four faces the yard is written in, carried in the app rather than
         fetched: this village works with the wifi off. -->
    <link rel="stylesheet" href="./fonts/fonts.css" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #2d5d6b;
      }
      canvas {
        display: block;
      }
      .notice {
        position: fixed;
        inset: auto 0 48px 0;
        text-align: center;
        font:
          14px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.04em;
        color: #cfe3e6;
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
        pointer-events: none;
        transition: opacity 400ms ease;
      }
      /* A district's name, unfurled off its pennant's tail while the pointer
         is on its land. `village/pennants.ts` pins it there and scales it a
         whole number of times; it is a tag on a flag, not a tooltip. */
      .pennant-tag {
        position: fixed;
        left: 0;
        top: 0;
        transform-origin: 0 0;
        pointer-events: none;
        visibility: hidden;
        clip-path: inset(0 100% 0 0);
        filter: drop-shadow(2px 2px 0 rgba(72, 37, 16, 0.5));
      }
      .pennant-tag > span {
        display: flex;
        align-items: center;
        box-sizing: border-box;
        height: 22px;
        padding: 0 8px;
        background: #c4b186;
        border: 2px solid #482510;
        font:
          16px/1 'Silkscreen',
          monospace;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #482510;
        white-space: nowrap;
      }
      .pennant-tag.open {
        visibility: visible;
        clip-path: inset(0 -4px -4px 0);
        animation: unfurl 120ms steps(2, end);
      }
      @keyframes unfurl {
        from {
          clip-path: inset(0 100% 0 0);
        }
        to {
          clip-path: inset(0 -4px -4px 0);
        }
      }
    </style>
  </head>
  <body>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
