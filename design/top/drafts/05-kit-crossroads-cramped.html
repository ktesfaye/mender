<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="lib.css">
<style>
.carve { font-family: Said; font-size: 16px; color: #24140a; text-shadow: 0 1px 0 rgba(255,235,200,.18); }
.carve.lit { color: #3a1e06; }
.carveNo { font-family: Cour; font-size: 10px; color: #2e1c0e; opacity: .7; }
.carveCaps { font-family: Jos; font-size: 14px; letter-spacing: 5px; color: #24140a; }
</style>
<div class="win"><div class="top" id="t"></div></div>
<script src="lib.js"></script>
<script src="kit.js"></script>
<script>
loadKit().then(() => {
const t = document.getElementById('t');
const g = makeCanvas(t, 3);
const ground = 46;
const rule = (x0, x1) => { const d = document.createElement('div'); d.style.cssText = `position:absolute;left:${x0*S}px;width:${(x1-x0)*S}px;top:${ground*S+1}px;height:1px;background:rgba(201,162,106,.18)`; t.appendChild(d); };
rule(5, 595);
const H = 10; // arrow board height used here: the kit board trimmed
const PX = 297;
kitPost(g, PX, 2, ground);
tuft(g, PX - 5, ground); tuft(g, PX + 8, ground); tuft(g, PX - 12, ground);
stone(g, PX + 12, ground + 1, 4, 2);

// crown: the project, on the kit's double board
const cw = 92, cx = PX + 3 - cw / 2;
const cb = shade(doubleBoard(cw), 'night');
shadowUnder(g, cx, 25, cw);
g.drawImage(cb, 0, 0, cw, 10, cx, 4, cw, 10);
g.drawImage(cb, 0, 10, cw, 10, cx, 13, cw, 10);
txt(t, cx, 4.5, 'INVEST-WEB', 'carveCaps', `width:${cw*S}px;text-align:center;height:${9*S}px;line-height:${9*S}px;padding-left:5px`);
txt(t, cx, 13.6, 'opus 5.5 · medium · auto', 'carveNo', `width:${cw*S}px;text-align:center;height:${9*S}px;line-height:${9*S}px;font-size:11px;opacity:.85`);

function arm(w, dir, y, look, label, no) {
  const b = shade(arrowBoard(w, dir), look);
  const bx = dir === 'r' ? PX + 3 : PX + 3 - w;
  shadowUnder(g, bx, y + 12, w);
  g.drawImage(b, bx, y);
  const tx = dir === 'r' ? bx + 6 : bx + 9;
  if (no) txt(t, tx, y + 1.3, no, 'carveNo', `height:${11*S}px;line-height:${11*S}px`);
  txt(t, tx + (no ? 11 : 0), y + 1.1, label, look === 'lit' ? 'carve lit' : 'carve', `height:${11*S}px;line-height:${11*S}px`);
  return bx;
}
// left
arm(64, 'l', 22, 'night', 'main', null);
house(g, PX - 50, 25, '#24140a');
arm(96, 'l', 34, 'night', 'Cost basis, split day', '71880');
// right
arm(112, 'r', 22, 'lit', 'Reason line under each loss');
glow(t, PX + 60, 28, 44, '#ffc060', .22);
arm(70, 'r', 34, 'warm', 'Flaky e2e', '71702');
txt(t, PX + 54, 35.3, '14s', 'timer', `height:${11*S}px;line-height:${11*S}px;font-size:10px;color:#a8460c`);
glow(t, PX + 40, 48, 16, '#ff9a3a', .5);
// further out, on posts of their own
kitPost(g, 150, 31, ground);
const q = shade(arrowBoard(66, 'l'), 'night'); shadowUnder(g, 156 + 15 - 66 - 6, 46, 66);
g.drawImage(q, 156 - 66 + 9, 33);
txt(t, 156 - 66 + 18, 34.3, '72011', 'carveNo', `height:${11*S}px;line-height:${11*S}px`);
txt(t, 156 - 66 + 29, 34.1, 'Q4 tax banner', 'carve', `height:${11*S}px;line-height:${11*S}px`);
tuft(g, 146, ground); tuft(g, 157, ground);
glow(t, 130, 48, 13, '#7fd36a', .45);
kitPost(g, 448, 36, ground);
const nb = shade(arrowBoard(16, 'r'), 'bare'); g.drawImage(nb, 443, 37);
txt(t, 447, 37, '+', 'carve', `height:${11*S}px;line-height:${11*S}px;font-size:18px;color:#8a7a68`);
tuft(g, 445, ground);

// the session's lantern stands at the foot of the post
g.drawImage(KIT['lantern-01-on'], PX + 8 + 0, ground - 19 - 0 + 0, 11, 19);
glow(t, PX + 13.5, 37, 22, '#ffb347', .5);

// the session, out on the left in the open
txt(t, 16, 16, 'Reason line under each loss', 'said', 'font-size:24px');
txt(t, 16.3, 26.5, 'reason-line<span class="s">·</span>Claude Code<span class="s">·</span>14s<span class="s">·</span>3 turns', 'meta');
txt(t, 524, 33, '45% full', 'meta', `font-size:11px;color:#9c8462;text-align:right;width:${72*S}px`);
});
</script>
