<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="lib.css">
<div class="win"><div class="top" id="t"></div></div>
<script src="lib.js"></script>
<script>
const t = document.getElementById('t');
const g = makeCanvas(t, 3);
const r = rng(7);

// the road: a dirt track that wanders gently across the whole bar, fading out at the far end
const roadY = (x) => 42;
for (let x = 30; x < 500; x++) {
  const y = roadY(x);
  const fade = x > 455 ? (500 - x) / 45 : 1;
  if (x > 455 && r() > fade) continue;
  px(g, x, y - 1, 1, 1, C.ink);
  px(g, x, y, 1, 4, C.dirt);
  px(g, x, y, 1, 1, C.dirtHi);
  px(g, x, y + 4, 1, 1, C.ink);
  if (r() < .06) px(g, x, y + 2, 1, 1, '#7a5a38');
  if (r() < .035 && fade > .6) tuft(g, x, y);
  
}

// home: a small cottage where the road starts
function cottage(x, y) {
  // walls
  px(g, x, y + 7, 18, 9, C.ink); px(g, x + 1, y + 8, 16, 8, '#c9a979'); px(g, x + 1, y + 8, 16, 1, '#e3c999');
  for (let i = 0; i < 16; i += 4) px(g, x + 1 + i, y + 11, 3, 1, '#a8885c');
  // roof
  for (let j = 0; j < 8; j++) { px(g, x - 2 + j, y + 7 - j, 22 - 2 * j, 1, C.ink); px(g, x - 1 + j, y + 7 - j, 20 - 2 * j, 1, j % 2 ? '#8a3a28' : '#a54a32'); }
  px(g, x + 6, y, 6, 1, C.ink);
  // chimney + smoke
  px(g, x + 13, y - 1, 3, 5, C.ink); px(g, x + 14, y, 1, 3, C.stoneHi);
  // door + lit window
  px(g, x + 3, y + 10, 4, 6, C.ink); px(g, x + 4, y + 11, 2, 5, '#5a3a22');
  px(g, x + 10, y + 10, 5, 4, C.ink); px(g, x + 11, y + 11, 3, 2, '#ffc96a');
}
cottage(14, 26);
glow(t, 26, 38, 12, '#ffc96a', .35);
label(t, 36, 34, 8, '<span style="font-family:Said;font-size:15px;color:#e9d6b4">invest-web</span>', '');

// a fingerpost: short post, one arrow board pointing on down the road
function finger(x, w, tone, no, name, opt = {}) {
  const base = roadY(x) - 1;
  post(g, x, base - 17, 17, 3);
  plank(g, x - 3, base - 15, w, 7, { point: 'r', tone, seed: x });
  const col = tone === 'gold' ? '#3a2208' : '#f1dfbd';
  if (no) label(t, x + 2.5, base - 15, 7, no, 'num', `color:${tone === 'gold' ? '#5a3a14' : '#e2c79a'};font-size:9.5px;opacity:.85`);
  label(t, x + (no ? 13.5 : 3.5), base - 15.2, 7, name, 'sign', `font-size:13.5px;color:${col}`);
  return base;
}

finger(118, 79, 'wood', '71880', 'Cost basis, split day');
const b2 = finger(212, 61, 'wood', '72011', 'Q4 tax banner');
glow(t, 236, b2 + 2, 12, '#7fd36a', .45);

// you are here: the lit one, a lantern on its post and the session written over it
const xc = 300;
const bc = roadY(xc) - 1;
post(g, xc, bc - 25, 25, 4);
plank(g, xc - 3, bc - 15, 101, 8, { point: 'r', tone: 'gold', seed: 9 });
label(t, xc + 4, bc - 15, 8, 'Reason line under each loss', 'sign lit', 'font-size:15px');
bracket(g, xc - 1, bc - 24, 7, -1); chain(g, xc - 7, bc - 23, 2); lantern(g, xc - 10, bc - 21, '#ffb347');
glow(t, xc - 7, bc - 16, 24, '#ffc060', .55);
glow(t, xc + 40, bc + 2, 30, '#ffc060', .25);

const b4 = finger(408, 62, 'wood', '71702', 'Flaky e2e');
label(t, 408 + 40, b4 - 15, 7, '14s', 'timer', 'font-size:9.5px');
glow(t, 426, b4 + 2, 14, '#ff9a3a', .55);

// the unmade end of the road: a bare stake for a new one
const b5 = roadY(482) - 1;
post(g, 482, b5 - 10, 10, 3);
label(t, 487, b5 - 11, 7, '+', 'sign', 'font-size:17px;color:#a88a62');

// the session's own line, in the open over the lit post
txt(t, xc + 6, 3.5, 'INVEST-WEB', 'caps', 'font-size:12px;letter-spacing:5px;opacity:.9');
txt(t, xc + 6, 8.6, 'Reason line under each loss', 'said', 'font-size:22px');
txt(t, xc + 6.4, 17.2, 'reason-line<span class="s">·</span>Claude Code<span class="s">·</span>14s<span class="s">·</span>3 turns', 'meta', 'font-size:11px');
txt(t, 486, 33, 'opus 5.5 · medium · auto', 'meta', 'font-size:11px;color:#e8cf9f;text-align:right;width:330px');
txt(t, 486, 38, '45% full', 'meta', 'font-size:11px;color:#9c8462;text-align:right;width:330px');
</script>
