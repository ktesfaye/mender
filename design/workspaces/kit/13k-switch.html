{const px=880,pb=146; im('stem.png',px-6,pb-34,6,17,`filter:brightness(.7)`); im('foot.png',px-14,pb-4,14,4,'filter:brightness(.4)'); nat('coil',px-26,pb+2,.75);}

   div('a',x,y+8,`width:${w*2}px;text-align:center;font:400 12px/13px MenderHand;color:${fable?'#2c1650':ink}`,S_.model+'<br>'+S_.effort);}
  // its peg bag hung on a nail on the far post, filling as its room goes
  {const bw=10,bh=14,x=L1-20,y=ty+50;
   div('a',L1-2,y-2,'width:6px;height:4px;background:#2e2016');div('a',x+8,y,'width:2px;height:6px;background:#4e3522');

     const f=Math.max(1,Math.round((bh-2)*S_.used/100));for(let yy=bh-1-f;yy<bh-1;yy++)for(let xx=1;xx<bw-1;xx++)p(xx,yy,tone(S_.used)||'#8a6a44');p(2,2,'#8a7a5a',6,1)},'filter:brightness(.85)');
   div('ink',x-166,ty+88,`width:160px;text-align:right;font:400 12px/14px MenderHand;color:${tone(S_.used)||'#e8d9b8'};text-shadow:0 1px 0 rgba(0,0,0,.8)`,S_.used+'% of its room used');}

       p(x,yy,edge?'#8a7d5e':band?'#b7ae86':((x+o)%9<4?'#e3d7bb':'#d8ccae'))}}},'filter:brightness(.86)');
  div('ink',fx+12,fy+6,`width:${fw*2-44}px;height:34px;display:flex;align-items:center;justify-content:center;font:400 14px/16px MenderHand;color:${ink};white-space:normal;text-align:center`,S_.name);

  const rib=(y,col,txt,font,tcol,w)=>{div('a',PX-8,y,`width:10px;height:6px;background:${col};box-shadow:inset 0 -2px rgba(0,0,0,.25)`);
     pix(PX,y,w/2,9,(g,p)=>{const W=w/2;for(let x=0;x<W;x++){const o=Math.round(Math.sin(x/5));const r=W-1-x;for(let yy=0;yy<7;yy++){if(r<4&&yy===3)continue;p(x,yy+1+o,yy===6?'rgba(0,0,0,.3)':col)}}});
     div('a',PX+4,y+3,`width:${w-14}px;text-align:center;font:${font};color:${tcol};white-space:nowrap`,txt);};
