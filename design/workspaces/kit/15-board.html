<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css">
<style>
@font-face { font-family: 'Josefin Sans'; src: url(fonts/josefin-sans-600-normal.woff2); font-weight: 600; }
@font-face { font-family: 'Josefin Sans'; src: url(fonts/josefin-sans-400-normal.woff2); font-weight: 400; }
@font-face { font-family: 'Courier Prime'; src: url(fonts/courier-prime-400-normal.woff2); font-weight: 400; }
@font-face { font-family: 'Courier Prime'; src: url(fonts/courier-prime-700-normal.woff2); font-weight: 700; }
@font-face { font-family: 'Courier Prime'; src: url(fonts/courier-prime-400-italic.woff2); font-weight: 400; font-style: italic; }
@font-face { font-family: 'MenderHand'; src: url(fonts/pretty-neat-400-normal.woff2); font-weight: 400; }
@font-face { font-family: 'MenderHand'; src: url(fonts/pretty-neat-700-normal.woff2); font-weight: 700; }
:root { --ink: #2c1e12; --ink2: #5b432a; --sore: #f08a72; --oxb: #a8342c; --gi: #9a6a10; }
body { background: #000 url(15-board-bg.png) 0 0/1480px 1020px no-repeat; }
img { image-rendering: pixelated; position: absolute; display: block; }
#top { position: absolute; left: 0; top: 0; width: 1480px; height: 220px; }
.abs { position: absolute; }

/* the board: dark under, lit over where lanterns reach */
#boardwrap { position: absolute; left: 24px; top: 18px; width: 812px; height: 144px;
  -webkit-mask-image: linear-gradient(#000 0, #000 126px, transparent 144px); }
#boardwrap img { left: 0; top: 0; width: 812px; height: 144px; }
#bdark { filter: brightness(.22) saturate(.65) contrast(1.05); }
#blit { filter: brightness(.95) saturate(.9);
  -webkit-mask-image:
    linear-gradient(transparent 124px, rgba(0,0,0,.55) 128px, rgba(0,0,0,.5) 140px, transparent 144px),
    radial-gradient(circle 330px at -1px 59px, rgba(0,0,0,.85) 0, rgba(0,0,0,.35) 45%, transparent 100%),
    radial-gradient(circle 150px at 811px 58px, rgba(0,0,0,.8) 0, rgba(0,0,0,.3) 50%, transparent 100%),
    radial-gradient(ellipse 230px 100px at 406px 90px, rgba(0,0,0,.6) 0, transparent 100%); }
body.point #bdark { filter: brightness(.5) saturate(.8); }
body.point #blit { -webkit-mask-image: none; filter: brightness(.7) saturate(.9); }

/* carved name of home */
#name { position: absolute; left: 32px; top: 28px; width: 796px; height: 18px; text-align: center; line-height: 17px; cursor: pointer; }
#name b { font: 600 12.5px 'Josefin Sans'; letter-spacing: .42em; color: #f2c66d; text-shadow: 0 -1px 0 rgba(0,0,0,.7), 0 1px 0 rgba(255,214,150,.16); margin-right: -.42em; }
#name i { font: 400 italic 10.5px 'Courier Prime'; letter-spacing: .06em; color: rgba(255,224,170,.22); margin-left: 14px; text-shadow: 0 -1px 0 rgba(0,0,0,.6); }

/* notices */
.n { position: absolute; width: 88px; height: 74px; filter: brightness(.56) saturate(.85); transition: none; }
.n img.bg { left: 0; top: 0; width: 100%; height: 100%; }
.n .pin { width: 10px; height: 10px; left: 39px; top: 5px; }
.n .k { position: absolute; left: 0; width: 100%; top: 17px; text-align: center; font: 700 10.5px 'Courier Prime'; letter-spacing: .02em; color: #3a2616; }
.n .t { position: absolute; left: 6px; right: 6px; top: 31px; text-align: center; font: 400 13.5px/14px 'MenderHand'; color: #2c1e12; }
.n .more { position: absolute; left: 0; width: 76px; top: 58px;  text-align: center; font: 400 9.5px 'Courier Prime'; color: #5b432a; opacity: 0; white-space: nowrap; }
body.point .n { filter: brightness(1.04) saturate(.95); }
body.point .n .more { opacity: 1; }
body.point .n .t { top: 29px; }
.n.ask { filter: brightness(.82) saturate(1) sepia(.25); }
.n.ask .k { color: #7a3a14; }
body.point .n.ask { transform: translateY(-3px); }
.n.broken .k { color: #8a2c24; }
.n.scrap .k { font-weight: 400; display: none; }
.n.scrap .t { top: 20px; font-size: 16px; line-height: 15px; }
.n.fresh { filter: brightness(.9) saturate(1.1); }
.n.fresh .t { top: 28px; }
.n.fresh .cnt { position: absolute; left: 0; width: 100%; top: 56px; left:0; width:76px; text-align: center; font: 400 italic 10.5px 'Courier Prime'; color: #7a3a14; }
.ribbon { width: 18px; height: 30px; }
.glow { position: absolute; pointer-events: none; mix-blend-mode: screen; }

/* hero */
#hero { box-shadow: 0 0 36px rgba(255,200,120,.22); position: absolute; left: 296px; top: 47px; width: 268px; height: 98px; filter: brightness(1.5) saturate(1.28) sepia(.12); }
#hero .bg { left: 0; top: 0; width: 268px; height: 98px; }
#hero .pin { width: 10px; height: 10px; left: 129px; top: 4px; }
#hero .stamp { position: absolute; left: 14px; top: 11px; font: 700 12px 'Courier Prime'; letter-spacing: .08em; color: var(--oxb); border: 2px solid var(--oxb); padding: 0 5px; line-height: 14px; transform: rotate(-2deg); opacity: .88; mix-blend-mode: multiply; }
#hero .st { position: absolute; right: 22px; top: 13px; font: 400 italic 10.5px 'Courier Prime'; color: var(--ink2); }
#hero .t { position: absolute; left: 14px; top: 31px; width: 236px; font: 400 17px/17px 'MenderHand'; color: var(--ink); }
#hero .rule { position: absolute; left: 14px; right: 24px; top: 70px; border-top: 2px dotted rgba(99,71,48,.55); }
#hero .s { position: absolute; left: 14px; top: 76px; font: 400 10px 'Courier Prime'; color: var(--ink2); white-space: nowrap; }
#hero .a { position: absolute; right: 18px; top: 76px; font: 400 italic 9.5px 'Courier Prime'; color: rgba(91,67,42,.75); }
.seal { width: 18px; height: 18px; }
.slip { width: 30px; height: 18px; filter: brightness(1.15); }
.slip s { position: absolute; left: 5px; height: 2px; background: rgba(60,40,22,.55); }
.crow { width: 16px; height: 14px; filter: brightness(1.9) saturate(.6); }
.chain { position: absolute; width: 2px; background: repeating-linear-gradient(#3a3330 0 2px, #6c625a 2px 4px); }
.iron { position: absolute; background: #2a2523; box-shadow: 0 2px 0 rgba(0,0,0,.4); }
#slate { position: absolute; left: 600px; top: 154px; width: 180px; height: 34px; }
#slate img { left: 0; top: 0; width: 180px; height: 34px; }
#slate div { position: absolute; left: 12px; top: 6px; font: 400 12px/12px 'MenderHand'; color: rgba(238,230,208,.82); letter-spacing: .02em; text-shadow: 0 0 1px rgba(255,255,255,.3); white-space: nowrap; }
#slate div + div { top: 18px; color: rgba(238,230,208,.62); }
body.point #slate div { color: rgba(250,244,226,.95); }

/* open */
#parch { position: absolute; left: 520px; top: 200px; width: 700px; height: 652px; display: none; filter: drop-shadow(0 22px 26px rgba(0,0,0,.55)); }
#parch .bg { left: 0; top: 0; width: 700px; height: 652px; }
#parch > .c { position: absolute; color: var(--ink); }
.hand { font-family: 'MenderHand'; } .cour { font-family: 'Courier Prime'; }
.gi { color: var(--gi); font: 600 12px 'Josefin Sans'; letter-spacing: .28em; text-transform: uppercase; cursor: pointer; }
.pr { position: absolute; left: 0; width: 700px; }
body.open #parch { display: block; }
body.open #hero, body.open #hero + * { }
body.open .hero-gone { display: none; }
#ghost { position: absolute; left: 296px; top: 47px; width: 268px; height: 98px; display: none; background: rgba(255,226,180,.06); box-shadow: inset 0 0 0 2px rgba(255,226,180,.06), 0 2px 0 rgba(0,0,0,.35); }
body.open #ghost { display: block; }
</style></head><body>
<div id="top">
  <div id="boardwrap"><img id="bdark" src="s15/board.png"><img id="blit" src="s15/board.png"></div>
  <div id="name"><b>INVEST-WEB</b><i>main</i></div>
  <div id="ghost"></div>
  <div id="notices"></div>
  <div id="lanterns"></div>
  <div id="glows"></div>
  <div id="slate"><img src="s15/slate.png"><div>auto · Opus 5.5 · medium</div><div>context 35% used</div></div>
</div>
<div id="parch"></div>
<script src="px.js"></script>
<script>
const q = new URLSearchParams(location.search).get('s') || '';
if (q) document.body.classList.add(q);
const $ = (id) => document.getElementById(id);
const im = (src, cls, st) => `<img src="s15/${src}.png" class="${cls || ''}" style="${st || ''}">`;
const S = (x, y, w, h, html, cls, extra) => `<div class="${cls || ''}" style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;${extra || ''}">${html}</div>`;

// small notices: [x, y, kind, key, title, extra, state]
const small = [
  [62, 71, 'scrap', '', 'chart spike', 'by hand', 'scrap'],
  [140, 61, 'torn', 'INV-72011', 'Tax banner', 'to do · done', 'done'],
  [216, 68, 'broken', 'INV-71702', 'Flaky e2e', 'in progress', 'broken'],
  [576, 63, 'small', 'INV-71990', 'Dividend toggle', 'in progress', 'work'],
  [650, 70, 'fresh', 'INV-72040', 'Gift lot', '', 'fresh'],
  [724, 59, 'small', 'INV-71880', 'Cost basis', 'in review', 'ask'],
];
let h = '';
for (const [x, y, kind, key, title, extra, st] of small) {
  const bg = { scrap: 'n-scrap', torn: 'n-torn', broken: 'n-broken', small: 'n-small', fresh: 'n-fresh' }[kind];
  const pin = st === 'work' ? 'pin-ember' : st === 'broken' ? 'pin-sore' : 'pin';
  const hh = kind === 'scrap' ? 66 : 74;
  h += `<div class="n ${st === 'ask' ? 'ask' : ''} ${kind === 'broken' ? 'broken' : ''} ${kind === 'scrap' ? 'scrap' : ''} ${kind === 'fresh' ? 'fresh' : ''}" style="left:${x}px;top:${y}px;height:${hh}px;${kind === 'scrap' ? 'width:88px' : ''}">
    ${im(bg, 'bg')}${im(pin, 'pin')}
    <div class="k">${key}</div><div class="t">${title}</div>
    ${kind === 'fresh' ? '<div class="cnt">pinning · 9s</div>' : `<div class="more">${extra}</div>`}</div>`;
  if (st === 'done') h += im('ribbon', 'ribbon', `left:${x + 35}px;top:${y - 8}px;height:22px;object-fit:cover;object-position:top;filter:brightness(.8)`);
}
// bare nail: a new workspace
h += im('nail', '', 'left:46px;top:84px;width:10px;height:24px;filter:brightness(1)');
// hero
const open = q === 'open';
if (!open) h += `<div id="hero" class="hero-gone">${im('n-hero', 'bg')}${im('pin', 'pin')}
  <div class="stamp">INV-71924</div><div class="st">in progress</div>
  <div class="t">Explain why a loss was disallowed (wash sale)</div>
  <div class="rule"></div><div class="s">Reason line under each loss</div><div class="a">Claude Code</div></div>`;
else h += im('nail', '', 'left:426px;top:48px;width:10px;height:24px;filter:brightness(.8)');
$('notices').innerHTML = h;
// GitLab on the current notice
let g = '';
if (!open) {
  g += im('seal-empty', 'seal', 'left:478px;top:134px') + im('seal-empty', 'seal', 'left:502px;top:134px');
  [[548, 60, 24], [550, 78, 30], [547, 96, 18]].forEach(([x, y, w], i) => {
    g += `<div style="position:absolute;left:${x}px;top:${y}px;width:30px;height:18px">${im('slip' + i, 'slip', 'left:0;top:0')}</div>`;
  });
  g += im('crow-hop-0', 'crow', 'left:410px;top:6px');
}
$('notices').insertAdjacentHTML('beforeend', g);
// crow sprite is in sprites/
// lanterns
$('lanterns').innerHTML =
  `<div class="iron" style="left:14px;top:46px;width:30px;height:2px"></div><div class="iron" style="left:36px;top:48px;width:2px;height:8px"></div><div class="chain" style="left:21px;top:48px;height:12px"></div>
   <img src="sprites/props-tx-village-props-lantern-01-on-png-x1.png" style="left:12px;top:58px;width:22px;height:38px">
   <div class="iron" style="left:818px;top:46px;width:28px;height:2px"></div><div class="iron" style="left:820px;top:48px;width:2px;height:8px"></div><div class="chain" style="left:835px;top:48px;height:10px"></div>
   <img src="sprites/props-tx-village-props-lantern-02-on-png-x1.png" style="left:826px;top:58px;width:18px;height:34px">
   <div class="chain" style="left:614px;top:148px;height:8px"></div><div class="chain" style="left:766px;top:148px;height:8px"></div>`;
$('glows').innerHTML =
  `<div class="glow" style="left:-340px;top:-280px;width:720px;height:720px;background:radial-gradient(circle at 363px 357px, rgba(255,150,64,.30) 0, rgba(255,132,50,.10) 30%, transparent 55%);"></div>
   <div class="glow" style="left:690px;top:-70px;width:300px;height:300px;background:radial-gradient(circle at 145px 145px, rgba(255,132,50,.34) 0, rgba(255,120,40,.10) 36%, transparent 68%);"></div>
   <div class="glow" style="left:296px;top:47px;width:268px;height:98px;background:radial-gradient(ellipse at 50% 40%, rgba(255,224,170,.16), transparent 75%);"></div>`;

// parchment
if (open) {
  const P = $('parch');
  P.innerHTML = `${im('parch', 'bg')}
  <div style="position:absolute;left:344px;top:10px;width:12px;height:12px;border-radius:50%;background:#3b2a18;box-shadow:inset 2px 2px 0 #1c130b"></div>
  <div class="c cour" style="left:30px;top:36px;font-weight:700;font-size:15px;letter-spacing:.08em;color:var(--oxb);border:2px solid var(--oxb);padding:0 7px;line-height:20px;transform:rotate(-2deg);mix-blend-mode:multiply">INV-71924</div>
  <div class="c cour" style="right:36px;top:40px;font-style:italic;font-size:12.5px;color:var(--ink2)">story · high · in progress</div>
  <div class="c hand" style="left:32px;top:76px;width:640px;font-weight:700;font-size:28px;line-height:32px">FE: G/L wash sale info, explaining why a loss was disallowed</div>
  <div class="c hand" style="left:32px;top:150px;width:630px;font-size:18px;line-height:24px;color:#33241a">When a loss is disallowed because of a wash sale, the gain/loss page only shows the smaller number and nobody can tell why. Put one line under each loss saying which repurchase caused it, and link to that lot.</div>
  <div class="c cour" style="left:32px;top:238px;font-size:12px;color:var(--ink2)">inv-71924-wash-sale-info &nbsp;·&nbsp; 3 ahead &nbsp;·&nbsp; 2 uncommitted &nbsp;·&nbsp; Reason line under each loss</div>
  <div class="c gi" style="left:32px;top:268px">open in jira</div>
  <div class="c" style="left:32px;right:32px;top:306px;border-top:2px dotted rgba(99,71,48,.6)"></div>
  <div class="c hand" style="left:32px;top:322px;font-weight:700;font-size:21px;line-height:24px">merge request !482</div>
  <div class="c cour" style="left:230px;top:328px;font-size:12px;color:var(--ink2);font-style:italic">Wash sale reason line, ready for review</div>

  <div class="c" style="left:32px;top:372px;width:20px;height:20px"><svg viewBox="0 0 9 9" width="22" height="22" shape-rendering="crispEdges" fill="#a8342c"><path d="M1 1h2v1h1v1h1V2h1V1h2v2H7v1H6v1h1v1h1v2H6V7H5V6H4v1H3v1H1V6h1V5h1V4H2V3H1z" transform="translate(0,0)"/></svg></div>
  <div class="c hand" style="left:66px;top:368px;font-weight:700;font-size:21px;color:#9a2f26">ci failed</div>
  <div class="c cour" style="left:66px;top:394px;font-size:12px;color:var(--ink2)">job lint stopped it: 5 errors in 2 files. Build and test never ran.</div>

  ${im('seal-empty', '', 'left:30px;top:442px;width:30px;height:30px')}${im('seal-empty', '', 'left:62px;top:442px;width:30px;height:30px')}
  <div class="c hand" style="left:106px;top:441px;font-weight:700;font-size:21px">needs 2 approvals</div>
  <div class="c cour" style="left:106px;top:467px;font-size:12px;color:var(--ink2)">asked: Mara Kovacs, Idris Ofori. Nobody has looked yet.</div>

  <div class="c hand" style="left:32px;top:512px;font-weight:700;font-size:21px">3 comments to answer</div>
  ${[['Mara', 'WashSaleNote.tsx:48', 'Trade date or settlement date for the repurchase?'],
     ['Mara', 'lots.ts:112', 'This falls over for a lot bought on a split day.'],
     ['Idris', 'WashSaleNote.test.tsx:20', 'Add a case for a loss that is only partly disallowed.']].map(([a, f, t], i) =>
    `<div class="c" style="left:${32 + i * 2}px;top:${544 + i * 30}px;width:636px;font:400 14.5px/17px MenderHand;color:#33241a"><span class="cour" style="font-size:11px;color:var(--ink2)">${a} · ${f}</span> &nbsp; ${t}</div>`).join('')}
  <div class="c gi" style="left:32px;top:628px;display:none">open in gitlab</div>
  <div class="c gi" style="right:36px;top:34px;display:none"></div>
  `;
  // gitlab link sits at the foot of the parchment
  P.insertAdjacentHTML('beforeend', `<div class="c gi" style="position:absolute;left:32px;top:622px;display:none">x</div>`);
}
document.fonts.ready.then(() => { document.body.dataset.ready = 1; });
</script></body></html>
