<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="theme.css">
<style>
@font-face { font-family: 'Courier Prime'; src: url(fonts/courier-prime-400-normal.woff2); font-weight: 400; }
@font-face { font-family: 'Courier Prime'; src: url(fonts/courier-prime-700-normal.woff2); font-weight: 700; }
.lg::before { display: none } .lg { box-shadow: 0 24px 60px rgba(0,0,0,.35) !important }

html, body { background: #000 }
body.m-scene { background: #000 url(11-head-bg.png) 0 0/1480px 1020px }

.abs { position: absolute }
.cr { font-family: 'Courier Prime', monospace }

/* ---- rail (the current workspace's sessions only) ---- */

.rl .nm { position: absolute; left: 34px; top: 17px; font: 12.5px 'Courier Prime', monospace; color: #f6ecdb; white-space: nowrap }
.rl .sub { position: absolute; left: 34px; top: 35px; font: 11.5px 'Courier Prime', monospace; white-space: nowrap }
.railkey { position: absolute; right: 40px; top: 911px; display: flex; align-items: center; gap: 8px; font: 11px 'Courier Prime', monospace; color: rgba(246,236,219,.38); letter-spacing: .06em }
.hue-ask { filter: hue-rotate(-14deg) saturate(1.5) } .hue-done { filter: hue-rotate(74deg) saturate(.75) brightness(.9) } .hue-broke { filter: hue-rotate(-30deg) saturate(1.1) brightness(.92) }

/* ---- the head ---- */
.head { left: 24px; top: 6px; width: 1140px; height: 128px; border-radius: 28px; transition: none }
body.s-open .head { height: 716px }
.head > * { position: absolute }
.crumbs { left: 28px; top: 13px; width: 604px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; height: 24px }
.crumbs .c1 { font-weight: 650; letter-spacing: .08em; color: var(--gold); font-size: 12px }
.crumbs .c2 { font-weight: 600; color: var(--gold) }
.crumbs .c3 { font-weight: 650; color: var(--ink-2); font-family: 'Courier Prime', monospace; font-size: 12.5px }
.crumbs .sp { flex: 1 }
  .ghost { display: inline-flex; align-items: center; gap: 7px; padding: 4px 11px 4px 9px; border-radius: 999px; color: var(--gold); font-weight: 650; font-size: 11.5px; background: var(--gold-soft); box-shadow: inset 0 0 0 1px rgba(242,198,109,.26) }
.ttl { left: 28px; top: 35px; width: 604px; font: 500 22px/1.15 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'WONK' 0, 'opsz' 60; letter-spacing: -.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.chips { left: 28px; top: 67px; width: 604px; align-items: center; display: flex; gap: 5px; align-items: center }
.ch { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 9px 0 8px; border-radius: 999px; font: 600 11px 'Figtree'; white-space: nowrap; background: rgba(255,240,215,.07); box-shadow: inset 0 0 0 1px var(--hair); color: var(--ink-2) }
.ch.moss { background: rgba(155,210,138,.12); box-shadow: inset 0 0 0 1px rgba(155,210,138,.25); color: #cfeac4 }
.ch.sore { background: rgba(240,138,114,.13); box-shadow: inset 0 0 0 1px rgba(240,138,114,.32); color: var(--sore) }
.ch.ask { background: rgba(255,122,58,.12); box-shadow: inset 0 0 0 1px rgba(255,122,58,.3); color: #ff9a62 }
.ch.sm { padding: 0 10px 0 7px }
.meta { left: 28px; top: 95px; width: 604px; display: flex; align-items: center; gap: 14px; font-size: 11.5px; color: var(--ink-3); height: 26px; white-space: nowrap }
.meta .d { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: italic 400 12.5px 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'opsz' 14; color: var(--ink-2); opacity: .8 }
.meta .m { flex: none }
.vr { left: 646px; top: 18px; width: 1px; height: 84px; background: linear-gradient(180deg, transparent, var(--hair) 18%, var(--hair) 82%, transparent) }

/* the other workspaces */
.others { left: 666px; top: 16px; width: 450px; display: grid; grid-template-columns: repeat(4, 108px); grid-auto-rows: 44px; gap: 10px 6px }
.wc { position: relative; display: grid; grid-template-columns: 19px 1fr; align-items: center; height: 44px; padding: 0 9px 0 10px; border-radius: 999px; background: rgba(255,240,215,.055); box-shadow: inset 0 0 0 1px var(--hair), inset 0 1px 0 rgba(255,255,255,.05) }
.wc.hov { background: rgba(255,240,215,.13); box-shadow: inset 0 0 0 1px rgba(255,238,210,.2), inset 0 1px 0 rgba(255,255,255,.1) }
.wc .lz { position: relative; width: 20px; height: 26px; display: grid; place-items: center }
.wc .lz img { position: relative; z-index: 1; width: 11px; height: 19px; image-rendering: pixelated }
.wc .lz .gl { position: absolute; inset: -6px -8px; background: radial-gradient(closest-side, var(--c), transparent 80%); opacity: .5 }
.wc .lz.off img { opacity: .65 }
.wc .t1 { display: flex; align-items: center; gap: 4px; font: 700 10px 'Courier Prime', monospace; color: var(--ink-3); letter-spacing: -.01em; height: 15px; white-space: nowrap }
.wc .t1 .sg { margin-left: auto; display: inline-flex }
.wc .t2 { font: 600 12.5px 'Figtree'; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 0; line-height: 16px; display: flex; gap: 5px }
  .wc .t2 .s { margin-left: auto; font: 400 9.5px 'Courier Prime', monospace; color: var(--ink-3) }
.wc .bd { min-width: 0 }
.wc.home .t2 { color: #cfe5c3 } .wc.home .t1 { color: rgba(185,211,168,.55) }
.wc.hov .t2 { color: var(--ink) }
.wc.add { background: transparent; box-shadow: inset 0 0 0 1px rgba(242,198,109,.3); border: 0; outline: 1px dashed transparent; display: flex; justify-content: center; gap: 7px; color: var(--gold); font: 650 11.5px 'Figtree' }
.wc .bar { position: absolute; left: 31px; right: 18px; bottom: 3px; height: 2px; background: repeating-linear-gradient(90deg, rgba(246,236,219,.16) 0 4px, transparent 4px 5px) }
.wc .bar::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 46%; background: repeating-linear-gradient(90deg, var(--work) 0 4px, transparent 4px 5px); box-shadow: 0 0 6px rgba(240,166,90,.5) }
.mtr { display: inline-flex; gap: 1px; align-items: center }
.mtr b { width: 3px; height: 7px; background: rgba(246,236,219,.16) } .mtr b.f { background: var(--work); box-shadow: 0 0 6px rgba(240,166,90,.55) }

/* popover */
.tip { width: 412px; border-radius: 26px; padding: 18px 18px 16px; left: 770px; top: 142px }
.tip .t1 { display: flex; align-items: center; gap: 8px }
.tip .key { font: 700 12.5px 'Courier Prime', monospace; color: var(--ink-2) }
.tip h4 { margin-top: 10px; text-wrap: balance; font: 500 21px/1.14 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'opsz' 40 }
.card { border-radius: 18px; background: rgba(255,240,215,.045); box-shadow: inset 0 0 0 1px var(--hair) }
.tip .ses { margin-top: 12px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; font-size: 13px }
.tip .ses .t { font-weight: 600 } .tip .ses .w { margin-left: auto; font-weight: 650; color: var(--ask); white-space: nowrap }
.tip .mr { margin-top: 8px; padding: 11px 12px 12px }
.tip .mr .h { display: flex; align-items: center; gap: 8px; font-size: 13px }
.tip .mr .h .id { font: 700 12.5px 'Courier Prime', monospace; color: var(--ink-2) }
.tip .mr .f { margin-top: 9px; display: flex; gap: 6px; flex-wrap: wrap }
.tip .bot { margin-top: 12px; display: flex; align-items: center; gap: 8px; font: 11.5px 'Courier Prime', monospace; color: var(--ink-3) }

/* open: ticket + merge request */
.open { left: 28px; top: 128px; right: 28px; bottom: 26px }
.open .rule { position: absolute; left: 0; right: 0; top: 0; height: 1px; background: var(--hair) }
.open .col { position: absolute; top: 22px; bottom: 0 }
.open .lab { margin: 0 0 10px 4px }
.desc { padding: 16px 18px 16px; font-size: 14.5px; line-height: 1.5; color: var(--ink-2) }
.desc p + p { margin-top: 8px }
.desc b { color: var(--ink); font-weight: 650 }
.flds { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px }
.fld { border-radius: 16px; padding: 11px 13px 12px; background: rgba(255,240,215,.045); box-shadow: inset 0 0 0 1px var(--hair), inset 0 1px 0 rgba(255,255,255,.04); height: 66px }
.fld .pix { font-size: 9px }
.fld .v { margin-top: 8px; display: flex; align-items: center; gap: 8px; font: 600 14px 'Figtree'; white-space: nowrap }
.av { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 11px 'Figtree'; color: #1a1612 }
.mrh { padding: 16px 18px 14px }
.mrh .a { display: flex; align-items: center; gap: 9px }
.mrh .id { font: 700 13px 'Courier Prime', monospace; color: var(--ink-2) }
.mrh h5 { margin-top: 9px; font: 500 19px/1.18 'Fraunces', serif; font-variation-settings: 'SOFT' 100, 'opsz' 40 }
.mrh .br { margin-top: 9px; display: flex; align-items: center; gap: 7px; font: 11.5px 'Courier Prime', monospace; color: var(--ink-3) }
.jobs { margin-top: 12px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px }
.job { border-radius: 14px; padding: 9px 10px 9px; background: rgba(255,240,215,.045); box-shadow: inset 0 0 0 1px var(--hair); height: 58px }
.job .n { display: flex; align-items: center; gap: 6px; font: 650 12.5px 'Figtree' }
.job .s { margin-top: 5px; font: 11px 'Courier Prime', monospace; color: var(--ink-3) }
.job.bad { background: rgba(240,138,114,.12); box-shadow: inset 0 0 0 1px rgba(240,138,114,.34) } .job.bad .n { color: var(--sore) } .job.bad .s { color: rgba(240,138,114,.8) }
.job.ok .n { color: #cfeac4 }
.job.wait .n { color: var(--ink-3) }
.appr { margin-top: 12px; padding: 12px 14px; display: flex; align-items: center; gap: 12px }
.slot { width: 28px; height: 28px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px rgba(246,236,219,.28); display: grid; place-items: center; font: 700 11px 'Figtree'; color: var(--ink-3); background: rgba(0,0,0,.18) }
.srow { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 12px; border-radius: 13px; font-size: 14px; font-weight: 600 }
.srow + .srow { box-shadow: 0 -1px 0 var(--hair) }
.lz2 { position: relative; width: 20px; height: 26px; display: grid; place-items: center }
.lz2 img { position: relative; z-index: 1; width: 11px; height: 19px; image-rendering: pixelated }
.lz2::before { content: ''; position: absolute; inset: -6px -8px; background: radial-gradient(closest-side, var(--c), transparent 80%); opacity: .5 }
.thr { margin-top: 12px; padding: 4px 6px }
.th { display: flex; align-items: flex-start; gap: 11px; padding: 9px 8px; border-radius: 13px }
.th + .th { box-shadow: 0 -1px 0 var(--hair) }
.th .q { font-size: 13px; line-height: 1.35; color: var(--ink) }
.th .w { margin-top: 2px; font: 11px 'Courier Prime', monospace; color: var(--ink-3) }

<script src="px.js"></script>
<script>
Object.assign(PX, {

  check: ['.........', '.......#.', '......##.', '.#...##..', '.##.##...', '..###....', '...#.....', '.........', '.........'],

  skip: ['.........', '.#.......', '.##......', '.###.#...', '.####.#..', '.###.#...', '.##......', '.#.......', '.........'],

const Q = new URLSearchParams(location.search);
const S = Q.get('s') || 'rest', M = Q.get('m') || 'glass';
document.body.className = 'm-' + M + ' s-' + S;
const ic = (n, c, s = 9) => `<i data-px="${n}" data-c="${c}" data-s="${s}"></i>`;

const cell = (w) => {

};
let g = `<div class="lg head" data-lg='{"tint":[14,15,18,0.42],"glareFactor":0.7,"fresnelFactor":0.25,"refThickness":24}'>

  <div class="chips">
    <span class="ch sm"><span class="dot" style="background:#f0a65a;box-shadow:0 0 8px rgba(240,166,90,.7)"></span>In Progress</span>
    <span class="ch sore">${ic('cross', '#f08a72', 10)}ci failed · lint</span>
    <span class="ch ask">${ic('person', '#ff9a62', 10)}0 of 2 approvals</span>
    <span class="ch ask">${ic('chat', '#ff9a62', 10)}3 comments</span>
    <span class="faint" style="margin-left:10px;font-size:11.5px;white-space:nowrap">Claude Code · 12m · 4 turns</span>

  <div class="vr"></div>
  <div class="others">${W.map(cell).join('')}<div class="wc add">${ic('plus', '#f2c66d', 12)}new</div></div>`;
if (S === 'open') {
  const fld = (l, v) => `<div class="fld"><div class="pix">${l}</div><div class="v">${v}</div></div>`;
  const lab = (t, c) => `<span class="ch sm" style="height:20px;font-size:10.5px;padding:0 8px;${c || ''}">${t}</span>`;
  g += `<div class="open"><div class="rule"></div>
   <div class="col" style="left:0;width:560px">
    <div class="pix lab">the ticket</div>
    <div class="card desc"><p><b>A loss that is added back by a rebuy vanishes from the gains and losses page</b> with no word why, and people write in.</p>

     ${fld('sprint', 'Sprint 42<span class="faint" style="font-weight:500;font-size:12px">day 6 of 10</span>')}
     ${fld('estimate', '5 points')}
     ${fld('epic', 'Tax-lot clarity')}

    </div>
