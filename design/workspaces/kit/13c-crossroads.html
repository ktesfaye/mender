<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Josefin Sans'; src: url(fonts/josefin-sans-400-normal.woff2); font-weight: 400; }
@font-face { font-family: 'Josefin Sans'; src: url(fonts/josefin-sans-600-normal.woff2); font-weight: 600; }
@font-face { font-family: 'Courier Prime'; src: url(fonts/courier-prime-400-normal.woff2); font-weight: 400; }
@font-face { font-family: 'MenderHand'; src: url(fonts/pretty-neat-400-normal.woff2); }
@font-face { font-family: 'MenderHand'; font-weight: 700; src: url(fonts/pretty-neat-700-normal.woff2); }
@font-face { font-family: 'Silk'; src: url(fonts/silkscreen-400-normal.woff2); }
html,body{margin:0;width:1480px;height:1020px;overflow:hidden}
img{position:absolute;image-rendering:pixelated;display:block}
.a{position:absolute}
.ink,.burn,.burn2,.paper{position:absolute}
.ink{font:400 13px/24px MenderHand;color:#2a1608;text-shadow:0 1px 0 rgba(255,232,190,.2);white-space:nowrap}
.ink i{font:600 8.5px 'Josefin Sans';font-style:normal;letter-spacing:.14em;margin-right:6px;opacity:.75;position:relative;top:-1px}
.glow{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none}
.burn{font:600 12px 'Josefin Sans';letter-spacing:.24em;color:#e8b95a;text-shadow:0 0 6px rgba(255,150,40,.55),0 1px 0 #2a1408;white-space:nowrap}
.burn2{font:400 8px 'Courier Prime';letter-spacing:.01em;color:#1c0e04;opacity:.95;white-space:nowrap}
.paper{font-family:MenderHand;color:#2d1a0a}
.breathe{animation:br 3.6s ease-in-out infinite}@keyframes br{50%{opacity:.7;transform:scale(.92)}}
.ink i{font:600 8.5px 'Josefin Sans';font-style:normal;letter-spacing:.14em;margin-right:6px;opacity:.75;position:relative;top:-1px}
</style></head><body><div id="r"></div><script src="13x-lib.js"></script>
<script>
hr();
// the road, from the big post to the rack
im('road.png',40,98,545,22,dim(pt?.42:.3));
const SX=290, BASE=128;
// big post: where you stand
stem(SX,8,60,pt?.8:.55);
im('foot.png',SX-14,BASE-2,14,4,dim(.45));
im('crook.png',SX-6-90+12,8,50,10,dim(.7));
const lx=SX-94, ly=10;
im(LAMP1,lx,ly,11,19,`filter:${ST.work.f}`);
div('a',lx+2,ly+10,'width:18px;height:6px;background:linear-gradient(#150b04e6,#150b04b0)');
cap(SX-70,12,70,'INVEST-WEB',.78);
const own=plank('R',SX-8,50,94,'Reason line under each loss','',.95,true);
const home=plank('L',SX+8-112,74,56,'home','',pt?.95:.5,pt,{stem:14});
im('house.png',home.x+14,home.y+1,11,11,dim(pt?.95:.6));
if(pt){home.d.style.left=(home.x+40)+'px'}
notice(SX+12,80);
crowOn(SX+50,-2);
glowAt(lx+10,ly+20,pt?300:230,pt?.26:.19);
div('glow breathe',lx-30,ly-10,'width:100px;height:100px;background:radial-gradient(circle,rgba(255,210,120,.5),rgba(255,170,70,0) 65%)');
// the roadside carries what it thinks with: a cairn for effort, the lantern's oil for context
im('cairn.png',150,BASE-34-2,13,17,dim(pt?.8:.55));
if(pt){
  div('ink',44,96,'font:400 12px/16px MenderHand;color:#d9c6a0','medium');
  div('ink',44,112,'font:400 12px/16px MenderHand;color:#d9c6a0','opus 5.5 · auto');
  im('armR-62.png',lx-176,12,62,12,dim(.95));
  div('ink',lx-160,12,'font:400 12px/24px MenderHand;color:#2a1608','room 35% · 5h 41%');
  div('ink',40,50,'width:0');
}
// the others, as fingerposts along the road
const SH=['Cost basis','Q4 banner','Dividend','Flaky e2e','chart spike','gift lots'];
WS.forEach((w,i)=>{
  const x=506+i*104, want=['ask','done','broke'].includes(w.st), cut=w.st==='cut';
  const br=want?.9:(pt?.9:.34);
  stem(x,62,33,br);
  im('foot.png',x-14,BASE-2,14,4,dim(.4));
  const a=plank('R',x-8,62,50,'',w.k||'spike',br,want||pt,{});
  if(pt) div('ink',x-4,104,'font:400 12px/16px MenderHand;color:#e2d0aa;width:70px;white-space:normal;text-shadow:0 1px 2px #000',SH[i]);
  if(cut){a.e.style.filter='brightness(1.3) saturate(.45) sepia(.2)';a.d.style.filter='none';a.d.style.opacity=1;if(!pt)a.d.innerHTML='<i>14s</i>';else a.d.innerHTML='<i>72040</i>14s'}
  if(want) hang(x+2*50-26,62+24,w.st);
});
if(open) sheets();
requestAnimationFrame(()=>document.body.dataset.ready=1);
</script></body></html>
