  };
}
function pick(id){if(busy||id===state.here)return;busy=true;showOpen(false);state.fan=false;scrim.style.opacity=0;hideWho();
  const sample=makePlan(id);const t0=performance.now();
  (function f(now){const t=now-t0;sample(Math.min(t,T_END+1));
    if(t<T_END)requestAnimationFrame(f);else finish(sample)})(t0);}
function finish(sample){
  if(right){[right.sc1,right.sc2].forEach(s=>s&&s.remove());right.root.remove();right.folk.forEach(f=>f.tip.remove())}
  right=sample.newRight;Object.assign(state,{here:sample.S2.here,prev:sample.S2.prev,fan:false});busy=false;
  document.body.dataset.picked=state.here;}

/* ============ boot ============ */
(async()=>{
  await document.fonts.load('14px MenderHand');await document.fonts.load('8px Silk');await document.fonts.load('8px "Courier Prime"');
  setCrown(state.here);
  const L=layout(state,false);place(L);
  right=buildRight(state.here,SX-8+2*L[state.here].W);
  rightPose(right,5000,0,null,'in');
  if(STATE==='point'){state.fan=true;const L2=layout(state,true);place(L2);scrim.style.opacity=1;}
  if(STATE==='open'){showOpen(true)}
  if(STATE==='mid'||STATE==='picked'){
    const target=Q.get('to')||'cost';const sample=makePlan(target);
    if(STATE==='mid'){sample(TMS)}
    else{sample(T_END+1);finish(sample)}
    busy=STATE==='mid';
  }
  if(STATE==='picked2'){}
  document.body.dataset.ready=1;
})();
</script></body></html>
