<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face { font-family: 'Josefin Sans'; src: url(fonts/josefin-sans-400-normal.woff2); font-weight: 400; }
@font-face { font-family: 'Josefin Sans'; src: url(fonts/josefin-sans-600-normal.woff2); font-weight: 600; }
@font-face { font-family: 'Courier Prime'; src: url(fonts/courier-prime-400-normal.woff2); font-weight: 400; }
@font-face { font-family: 'MenderHand'; src: url(fonts/pretty-neat-400-normal.woff2); }
@font-face { font-family: 'MenderHand'; font-weight: 700; src: url(fonts/pretty-neat-700-normal.woff2); }
@font-face { font-family: 'Silk'; src: url(fonts/silkscreen-400-normal.woff2); }
html,body{margin:0;width:1480px;height:1020px;overflow:hidden;background:#000 url(13-bg.png) 0 0/1480px 1020px no-repeat}
img{position:absolute;image-rendering:pixelated;display:block}
.a{position:absolute}
.ink,.burn,.burn2,.paper{position:absolute}
.ink{font:400 13px/24px MenderHand;color:#2a1608;text-shadow:0 1px 0 rgba(255,232,190,.2);white-space:nowrap}
.ink i{font:600 8.5px 'Josefin Sans';font-style:normal;letter-spacing:.14em;margin-right:6px;opacity:.75;position:relative;top:-1px}
.glow{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none}
.burn{font:600 12px 'Josefin Sans';letter-spacing:.24em;color:#e8b95a;text-shadow:0 0 6px rgba(255,150,40,.55),0 1px 0 #2a1408;white-space:nowrap}
.burn2{font:400 8px 'Courier Prime';letter-spacing:.01em;color:#1c0e04;opacity:.95;white-space:nowrap}
.breathe{animation:br 3.6s ease-in-out infinite}
@keyframes br{50%{opacity:.7;transform:scale(.92)}}
.paper{font-family:MenderHand;color:#2d1a0a}
</style></head><body>
<div id="r"></div>
<script>
const Q=new URLSearchParams(location.search).get('s')||'';
const pt=Q==='point', open=Q==='open';
const R=document.getElementById('r');
const P='13-parts/';
function im(src,x,y,w,h,st=''){const e=document.createElement('img');e.src=P+src;e.style.cssText=`left:${x}px;top:${y}px;width:${w*2}px;height:${h*2}px;${st}`;R.appendChild(e);return e}
function div(cls,x,y,st,html=''){const e=document.createElement('div');e.className=cls;e.style.cssText=`left:${x}px;top:${y}px;${st}`;e.innerHTML=html;R.appendChild(e);return e}
const SX=330;
const dimF=b=>`filter:brightness(${b}) saturate(.9)`;
const ST={work:{f:'hue-rotate(-8deg) saturate(1.15)',g:'255,160,60'},ask:{f:'hue-rotate(-22deg) saturate(1.7) brightness(1.05)',g:'255,120,40'},done:{f:'hue-rotate(62deg) saturate(1.2)',g:'120,220,110'},broke:{f:'hue-rotate(-48deg) saturate(1.9) brightness(.95)',g:'230,50,40'}};
const Y0=52, PITCH=24;
// post
im('stem.png',SX-6,8,6,98,dimF(pt?.8:.55));
im('foot.png',SX-14,8+196-2,14,4,dimF(.45));
im('crook.png',SX-6-90+12,8,50,10,dimF(pt?.9:.7));
const lx=SX-94, ly=12;
im('props-tx-village-props-lantern-01-on-png-x1.png',lx,ly,11,19,`filter:${ST.work.f}`);
div('a',lx+2,ly+10,'width:18px;height:6px;background:linear-gradient(#150b04e6,#150b04b0);');
im('cap.png',SX-70,14,70,16,dimF(pt?.95:.78));
div('burn',SX-70+16,18,'','INVEST-WEB');
div('burn2',SX-70+14,36,'','opus 5.5 · medium · auto');
// arms: words only where he is looked at
function arm(side,row,W,txt,key,br,words,extra=''){
  const y=Y0+row*PITCH, x=side==='R'?SX-8:SX+8-2*W;
  const e=im(`arm${side}-${W}.png`,x,y,W,12,`filter:brightness(${br}) saturate(.9)${extra}`);
  const d=div('ink',side==='R'?x+18:x+16,y,`filter:brightness(${br});transition:none;${words?'':'opacity:0'}`,(key?`<i>${key}</i>`:'')+txt);
  if(side==='L'){const lo=x+16,hi=SX-12;d.style.left=lo+'px';d.style.width=(hi-lo)+'px';d.style.textAlign='center';d.style.overflow='hidden'}
  return {x,y,W,e,d};
}
function lamp(a,kind){
  const cx=a.x+9;
  // iron hook under the tip, a short chain, the lantern
  div('a',cx-3,a.y+22,'width:8px;height:3px;background:#2e2016');
  div('a',cx-1,a.y+25,'width:2px;height:3px;background:#2e2016');
  div('a',cx-1,a.y+29,'width:2px;height:2px;background:#6f5a44');
  div('a',cx-1,a.y+32,'width:2px;height:3px;background:#2e2016');
  im('props-tx-village-props-lantern-02-on-png-x1.png',cx-9,a.y+35,9,17,`filter:${ST[kind].f}`);
  div('glow breathe',cx-30,a.y+35-14,`width:60px;height:60px;background:radial-gradient(circle,rgba(${ST[kind].g},.34),rgba(${ST[kind].g},0) 66%)`);
}
const W=pt;
const home=arm('L',0,70,'home','',pt?.95:.5,pt);
im('house.png',home.x+16,home.y+1,11,11,dimF(pt?.95:.6));
if(pt){home.d.style.left=(home.x+54)+'px';home.d.style.textAlign='left'}
const a1=arm('L',1,104,'Cost basis, split day','71880',pt?.95:.9,true); lamp(a1,'ask');
const a2=arm('L',2,86,'Q4 tax banner','72011',pt?.95:.9,true); lamp(a2,'done');
const a3=arm('L',3,68,'Flaky e2e','71702',pt?.95:.88,true); lamp(a3,'broke');
const cur=arm('R',0,94,'Reason line under each loss','',.95,true);
arm('R',1,84,'Dividend reinvest','71990',pt?.95:.32,pt);
arm('R',2,60,'chart spike','',pt?.95:.32,pt);
const cut=arm('R',3,60,'lots <b style="font-weight:400">14s</b>','72040',1,pt);
cut.e.style.filter='brightness(1.3) saturate(.45) sepia(.2)';
cut.d.style.filter='none';
if(!pt){div('ink',cut.x+22,cut.y,'font:400 11px/24px MenderHand;color:#2a1608','14s')}
div('a',cut.x+8,cut.y+3,'width:4px;height:4px;background:#f1e7cf');div('a',cut.x+8,cut.y+17,'width:4px;height:4px;background:#f1e7cf');
div('a',cut.x+2*cut.W-30,cut.y+28,'width:2px;height:2px;background:#e9d9b0');div('a',cut.x+2*cut.W-46,cut.y+34,'width:2px;height:2px;background:#e9d9b0');
// peg
const PGY=Y0+4*PITCH+2;
im('peg.png',SX-6-16,PGY,8,5,dimF(pt?.95:.5));
if(pt) div('a',SX-6-16-4,PGY+2,'width:4px;height:4px;background:#f2c66d;opacity:.9');
// notice: small, lit only by the lantern's warm light, edges in shadow
const NW=48, NH=24, nx=SX-NW, ny=PGY+10, NX2=nx+NW*2-14;
if(!open){
  im('slip.png',nx+NW*2-34,ny-8,9,7,'filter:brightness(.7)');im('slip.png',nx+NW*2-26,ny-10,9,7,'filter:brightness(.7)');im('slip.png',nx+NW*2-18,ny-7,9,7,'filter:brightness(.7)');
  im('notice48.png',nx,ny,NW,NH,'filter:brightness(.62) sepia(.25) saturate(1.2)');
  const tx='filter:brightness(.7);';
  div('ink',nx+10,ny+4,'font:700 12px/14px MenderHand;color:#33200f;'+tx,'INV-71924');
  div('ink',nx+10,ny+19,'font:400 11.5px/14px MenderHand;color:#33200f;'+tx,'Wash sale info');
  div('ink',nx+10,ny+32,'font:400 10px/12px MenderHand;color:#6a4c26;'+tx,'in progress');
  div('a',nx,ny,`width:${NW*2}px;height:${NH*2}px;background:radial-gradient(ellipse at 20% 0%,rgba(0,0,0,0) 20%,rgba(6,3,0,.5) 100%);box-shadow:inset 0 0 8px 3px rgba(6,3,0,.7)`);
  im('nail.png',NX2,ny+4,3,3);
  im('seal-empty.png',SX-24,ny+NH*2-4,9,9,'filter:brightness(1.2)');im('seal-empty.png',SX+6,ny+NH*2-4,9,9,'filter:brightness(1.2)');
}else{ im('nail.png',NX2,ny+4,3,3); }
im('crow-hop-0-x1.png',SX+44,14-14,8,7,'filter:brightness(1.1)');
// light
div('glow',lx-210,ly-170,`width:${pt?640:520}px;height:${pt?520:420}px;background:radial-gradient(ellipse,rgba(255,168,70,${pt?.28:.2}),rgba(255,140,50,.07) 45%,rgba(255,120,40,0) 70%)`);
div('glow breathe',lx-40,ly-20,'width:100px;height:100px;background:radial-gradient(circle,rgba(255,210,120,.5),rgba(255,170,70,0) 65%)');
if(pt){
  im('armR-62.png',lx-176,12,62,12,dimF(.95));
  div('ink',lx-160,12,'font:400 12px/24px MenderHand;color:#2a1608','room 35% · 5h 41%');
}
// ---- the ticket taken down to read
if(open){
  const sx=500, sy=160;
  const sheet=(x,w)=>{im('sheet.png',x,sy,220,330,'filter:drop-shadow(0 10px 16px rgba(0,0,0,.4))');
    [[x+14,sy+14],[x+w-24,sy+14],[x+14,sy+640],[x+w-24,sy+640]].forEach(p=>im('nail.png',p[0],p[1],3,3));};
  sheet(sx,440); sheet(sx+470,440);
  const A=sx+44,B=sx+470+44;
  div('paper',A,sy+44,'font:600 11px "Josefin Sans";letter-spacing:.3em;color:#5a3d1c','INV-71924');
  div('paper',A,sy+66,'font:400 14px MenderHand;color:#7a5a2e','story · high · in progress');
  div('paper',A,sy+96,'font:700 25px/30px MenderHand;width:350px;color:#2d1a0a','FE: G/L wash sale info, explaining why a loss was disallowed');
  div('a',A,sy+192,'width:340px;height:0;border-top:2px dotted rgba(70,44,20,.4)');
  div('paper',A,sy+210,'font:400 16.5px/24px MenderHand;width:340px;color:#3a2410','When a loss is disallowed because of a wash sale, the page should say so, and name the lot that triggered it, right under the loss.');
  div('paper',A,sy+330,'font:400 10px "Courier Prime";color:#6a4c26;letter-spacing:.04em','inv-71924-wash-sale-info');
  div('paper',A,sy+372,'font:400 15px/22px MenderHand;width:340px;color:#3a2410','two are working in here:<br>Reason line under each loss, twelve minutes in<br>Lot link API, which wants you');
  div('paper',A,sy+592,'font:400 15px MenderHand;color:#a4701a','open in jira');
  // merge request
  div('paper',B,sy+44,'font:600 11px "Josefin Sans";letter-spacing:.3em;color:#5a3d1c','MERGE REQUEST !482');
  div('paper',B,sy+66,'font:700 21px/26px MenderHand;width:350px;color:#2d1a0a','FE: wash sale info on the G/L page');
  div('paper',B,sy+112,'font:600 9.5px "Josefin Sans";letter-spacing:.3em;color:#7a5a2e','THE CHECKS');
  div('paper',B,sy+130,'font:700 17px MenderHand;color:#a3321f','they failed');
  div('paper',B,sy+154,'font:400 15px/21px MenderHand;width:350px;color:#3a2410','the job called lint stopped it: two errors in LossRow.tsx, four minutes ago');
  div('paper',B,sy+222,'font:600 9.5px "Josefin Sans";letter-spacing:.3em;color:#7a5a2e','WHO HAS SAID YES');
  im('seal-empty.png',B,sy+242,9,9,'filter:brightness(1.9)');im('seal-empty.png',B+28,sy+242,9,9,'filter:brightness(1.9)');
  div('paper',B+62,sy+244,'font:400 15px MenderHand;color:#3a2410','nobody yet, it needs two');
  div('paper',B,sy+290,'font:600 9.5px "Josefin Sans";letter-spacing:.3em;color:#7a5a2e','THREE TO ANSWER');
  [['maya','should the page say disallowed, or deferred?'],['tom','the lot link needs the API first'],['sam','who writes the words in the tooltip?']].forEach((t,i)=>{
    const y=sy+314+i*74;
    im('slip.png',B,y+2,9,7);
    div('paper',B+30,y,'font:600 10px "Josefin Sans";letter-spacing:.2em;color:#6a4c26',t[0].toUpperCase());
    div('paper',B+30,y+18,'font:400 15px/21px MenderHand;width:320px;color:#3a2410',t[1]);
  });
  div('paper',B,sy+592,'font:400 15px MenderHand;color:#a4701a','open in gitlab');
}
// a few embers drifting off the lantern
requestAnimationFrame(()=>document.body.dataset.ready=1);
</script></body></html>
