function applyFurniture(L,f){ // f: bundle fold amount 0..1
  const show=L.n>1&&!L.fan?1:0, op=f===undefined?show:f;
  const x=SX+8-2*L.quietW;
  const ht=L.bottom-L.bY;
  rope.style.left=(SX-30)+'px';rope.style.top=(L.bY-2)+'px';rope.style.height=Math.max(ht+4,0)+'px';rope.style.opacity=op;
  knot.style.left=(SX-30)+'px';knot.style.top=(L.bY+ht/2-4)+'px';knot.style.opacity=op;
  blabel.innerHTML=L.label;blabel.style.left=(SX+8-2*L.quietW+16)+'px';blabel.style.width=(2*L.quietW-16-52)+'px';blabel.style.top=L.bY+'px';blabel.style.opacity=op;

function stateAt(from,to,p,swingPair){ // draw frame p
  const e=ease(p);
  const bottom=lerp(from.bottom,to.bottom,e);
  Object.keys(to.T).forEach(id=>{const a=actors[id],f=from.T[id]||to.T[id],t=to.T[id];
    const v=a.v;
    v.y=lerp(f.y,t.y,e);v.br=lerp(f.br,t.br,e);v.pale=t.pale;v.z=(swingPair.includes(id))?40:t.z;
    v.txt=lerp(f.txt,t.txt,e);
    // lamps: the one you walk into snuffs first, the one you left lights last
    v.lamp=t.lamp>f.lamp?cl((p-.55)/.4):t.lamp<f.lamp?1-cl(p/.4):t.lamp;
    let c=lerp(f.c,t.c,e);
    if(f.c!==t.c&&t.c===1&&p>.8)c=1+.045*Math.sin(cl((p-.8)/.2)*Math.PI);
    v.c=c; a.bundled=t.bundled;
    applyActor(a)});
  applyPost(bottom);
}
function flush(L){Object.keys(L.T).forEach(id=>{actors[id].bundled=L.T[id].bundled})}

// the swing
let busy=false;
function pick(id,opt={}){
  if(busy||id===cur.here)return;busy=true;
  const old=lay, oldHere=cur.here;
  const next=layout(id,false);
  const oldScene=scene; const newScene=mkScene(id);
  newScene.S.style.opacity=0;
  const dur=opt.dur||1050;
  const pair=[id,oldHere];
  if(oldScene){oldScene.S.querySelectorAll('.crow').forEach(c=>c.classList.add('leave'))}
  applyFurniture(next,undefined);
  const crowsLanded={d:false};
  const frame=p=>{
    stateAt(old,next,p,pair);
    applyFurniture(next, lerp(old.n>1&&!old.fan?1:0, next.n>1?1:0, ease(p)));
    if(oldScene){const k=cl(p/.32);oldScene.S.style.opacity=1-k;oldScene.S.style.transform=`translateY(${Math.round(k*22/2)*2}px)`}
    const k2=cl((p-.72)/.26);newScene.S.style.opacity=k2;newScene.S.style.transform=`translateY(${Math.round((1-easeO(k2))*20/2)*2}px)`;
    if(p>.7&&!crowsLanded.d){crowsLanded.d=true;newScene.crows.forEach((c,i)=>{c.classList.add('land');c.style.animationDelay=(i*70)+'ms'});setCrown(by(id))}
    const sh=p>.8&&p<.97?(Math.round(Math.sin(p*90)*2)):0;PG.style.transform=`translateX(${sh}px)`;
  };
  const finish=()=>{frame(1);PG.style.transform='';if(oldScene)oldScene.S.remove();scene=newScene;cur.here=id;lay=next;flush(next);busy=false;dimEl.style.opacity=0;document.body.dataset.picked=id};
  if(opt.freeze!==undefined){frame(opt.freeze);if(opt.freeze>=1)finish();document.body.dataset.ready=1;return}
  const t0=performance.now();
  const loop=now=>{const p=cl((now-t0)/dur);frame(p);if(p<1)requestAnimationFrame(loop);else finish()};
  requestAnimationFrame(loop);
}
// folding and fanning of the resting bundle
let fanT=null;
function setFan(on,instant){
  if(busy||cur.fan===on&&!instant)return; cur.fan=on;

  const fin=()=>{lay=to;flush(to);frame(1);applyFurniture(to)};
  if(!dur){fin();return}
  cancelAnimationFrame(fanT);
  const loop=now=>{const p=cl((now-t0)/dur);frame(p);if(p<1)fanT=requestAnimationFrame(loop);else fin()};fanT=requestAnimationFrame(loop);
