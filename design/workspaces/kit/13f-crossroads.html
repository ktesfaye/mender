<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'Josefin Sans'; src: url(fonts/josefin-sans-400-normal.woff2); font-weight: 400; }
@font-face { font-family: 'Josefin Sans'; src: url(fonts/josefin-sans-600-normal.woff2); font-weight: 600; }
@font-face { font-family: 'Courier Prime'; src: url(fonts/courier-prime-400-normal.woff2); font-weight: 400; }
@font-face { font-family: 'MenderHand'; src: url(fonts/pretty-neat-400-normal.woff2); }
@font-face { font-family: 'MenderHand'; font-weight: 700; src: url(fonts/pretty-neat-700-normal.woff2); }

html,body{margin:0;width:1480px;height:1020px;overflow:hidden}
img{position:absolute;image-rendering:pixelated;display:block}
.a{position:absolute}
.ink,.burn,.burn2,.paper{position:absolute}
.ink{font:400 13px/24px MenderHand;color:#2a1608;text-shadow:0 1px 0 rgba(255,232,190,.2);white-space:nowrap}
.ink i{font:600 8.5px 'Josefin Sans';font-style:normal;letter-spacing:.14em;margin-right:6px;opacity:.75;position:relative;top:-1px}
.glow{position:absolute;border-radius:50%;mix-blend-mode:screen;pointer-events:none}
.burn{font:600 12px 'Josefin Sans';letter-spacing:.24em;color:#e8b95a;text-shadow:0 0 6px rgba(255,150,40,.55),0 1px 0 #2a1408;white-space:nowrap}
.burn2{font:400 8px 'Courier Prime';letter-spacing:.01em;color:#1c0e04;opacity:.95;white-space:nowrap}
.paper{font-family:MenderHand;color:#2d1a0a}
.breathe{animation:br 3.6s ease-in-out infinite}@keyframes br{50%{opacity:.7;transform:scale(.92)}}
.ink i{font:600 8.5px 'Josefin Sans';font-style:normal;letter-spacing:.14em;margin-right:6px;opacity:.75;position:relative;top:-1px}
</style></head><body><div id="r"></div><script src="13x-lib.js"></script>
<script>
(async()=>{
await document.fonts.load('12px MenderHand'); await document.fonts.load('600 9px "Josefin Sans"');
const cv=document.createElement('canvas').getContext('2d');
const tw=(t,px,f='MenderHand')=>{cv.font=`${px}px ${f}`;return cv.measureText(t).width};
hr();
const SX=116;
// ---- the short post: the project on its cap, the session on a board hung under it
stem(SX,8,62,.55);
im('foot.png',SX-14,126,14,4,dim(.45));
cap(SX-70,8,70,'INVEST-WEB',.8);
[SX-54,SX+34].forEach(cx=>{for(let i=0;i<8;i+=4)div('a',cx,40+i,'width:2px;height:3px;background:'+(i?'#6f5a44':'#2e2016'))});
im('cap84.png',SX-84,48,84,16,dim(.85));
div('ink',SX-84+14,52,'width:140px;font:400 12px/15px MenderHand;color:#2d1608;filter:brightness(.9);text-align:center','Reason line under each loss');
div('ink',SX-84+14,68,'width:140px;font:400 8px/10px "Courier Prime";color:#1c0e04;opacity:.9;text-align:center','opus 5.5 · medium · auto');
// the lantern on the cap's hook: the session's own light; its oil is the context
const lx=SX+72, ly=8;
div('a',lx-2,ly-2,'width:14px;height:3px;background:#2e2016');
im(LAMP1,lx,ly+1,11,19,`filter:${ST.work.f}`);
div('a',lx+2,ly+11,'width:18px;height:6px;background:linear-gradient(#150b04e6,#150b04b0)');
div('glow breathe',lx-40,ly-20,'width:100px;height:100px;background:radial-gradient(circle,rgba(255,210,120,.5),rgba(255,170,70,0) 65%)');
glowAt(lx+10,ly+20,pt?300:240,pt?.25:.18);
// ---- the row
const RX0=SX+88, RX1=1238;
const FS=11;
const plan=[
 {id:'home',title:'home',key:'',st:'home'},
 {id:'own',title:'Explain why a wash-sale loss was disallowed',key:'INV-71924',st:'own'},
 {id:'a',title:'Cost basis',key:'71880',st:'ask',mr:{seals:[1,1],slips:1}},
 {id:'b',title:'Q4 banner',key:'72011',st:'done'},
 {id:'c',title:'Flaky e2e',key:'71702',st:'broke'},
 {id:'d',title:'chart spike',key:'',st:'quiet'},
 {id:'e',title:'Dividend toggle',key:'71990',st:'quiet',mr:{seals:[1,0],slips:0}},
 {id:'f',title:'Gift lots',key:'72040',st:'cut'}];
plan.forEach(p=>{
  const kw=p.key?(p.key.length*6.4+10):0;
  const t=tw(p.title,p.st==='own'?12:FS)+(p.st==='home'?34:0)+(p.st==='cut'?20:0);
  p.W=Math.ceil((kw+t+34+(p.st==='done'?26:0))/2/2)*2; if(p.st==='own')p.W=Math.ceil((kw+128+38)/2/2)*2;
  console.log(p.id,p.W*2);
});
// overflow: the oldest quiet planks stack two deep
const total=()=>plan.reduce((s,p)=>s+(p.stackedUnder?0:p.W*2),0)+16;
const d_=plan.find(p=>p.id==='d'), e_=plan.find(p=>p.id==='e');
let over=total()>RX1-RX0;
if(over){e_.stackedUnder=d_; d_.W=Math.max(d_.W,e_.W); e_.W=d_.W}
console.log('total',total(),'avail',RX1-RX0,'over',over);
let x=RX0; const at={};
plan.forEach(p=>{
  if(p.stackedUnder){p.x=p.stackedUnder.x;p.y=80}
  else{p.x=x;p.y=p.st==='own'?50:54; x+=p.W*2}
  at[p.id]=p;
});
const hookX=x+2;
plan.forEach(p=>{
  const big=p.st==='own';
  const quiet=p.st==='quiet'||p.st==='home';
  const br=big?1:(p.st==='cut'?1:(quiet?(pt&&p.id==='a'?1:.66):(.92)));
  const H=big?16:12, hpx=H*2;
  const src=big?`armBR-${p.W}.png`:(p.st==='broke'?`armX-${p.W}.png`:`armR-${p.W}.png`);
  const slipsN=big?3:(p.mr?p.mr.slips:0);
  // slips tucked into the top edge
  for(let i=0;i<slipsN;i++){const sx=p.x+p.W*2-86-i*(big?18:0)-(big?0:30); im('slip.png',sx,p.y-(big?9:5),9,7,(big?'':'')+'filter:brightness(.85)')}
  const e=im(src,p.x,p.y,p.W,H,`filter:brightness(${br}) saturate(.9)`);
  if(p.st==='cut'){e.style.filter='brightness(1.3) saturate(.5) sepia(.2)';div('a',p.x+8,p.y+3,'width:4px;height:4px;background:#f1e7cf');div('a',p.x+8,p.y+17,'width:4px;height:4px;background:#f1e7cf')}
  // words: key small and faint, then the title
  const kfs=big?9:8.5;
  let inner=big?`<span><i style="font-size:${kfs}px">${p.key}</i>${p.title}</span>`:((p.key?`<i style="font-size:${kfs}px">${p.key}</i>`:'')+p.title);
  if(p.st==='home'){im('house.png',p.x+14,p.y+1,11,11,dim(.7));inner=p.title}
  if(p.st==='cut') inner+=` <span style="opacity:.8;font-size:10.5px;margin-left:8px">14s</span>`;
  const lo=p.x+(p.st==='home'?42:18), hi=p.x+p.W*2-(p.st==='broke'?12:16)-(p.st==='done'?26:0);
  div('ink',lo,p.y,`width:${hi-lo}px;overflow:hidden;white-space:${big?'normal':'nowrap'};display:flex;align-items:center;filter:brightness(${br===1.3?1:br});font-size:${big?12:FS}px;line-height:${big?'14px':hpx+'px'};${p.st==='cut'?'filter:none;':''}`,inner);
  // GitLab, on the plank itself
  if(big){
    // two wax seals hung off the underside, empty while approvals are missing
    [p.x+40,p.x+90].forEach(cx=>{div('a',cx+8,p.y+hpx,'width:2px;height:6px;background:#6f5a44');im('seal-empty.png',cx,p.y+hpx+6,9,9,'filter:brightness(1.5)')});
    crowOn(p.x+p.W*2-60,p.y-14);
  }else if(p.mr){
    p.mr.seals.forEach((g,i)=>{const cx=p.x+14+i*14;div('a',cx+4,p.y+hpx,'width:1px;height:4px;background:#6f5a44');
      const s=document.createElement('img');s.src=P+(g?'seal-full.png':'seal-empty.png');s.style.cssText=`left:${cx}px;top:${p.y+hpx+4}px;width:9px;height:9px;filter:brightness(${g?1:1.4})`;R.appendChild(s)});
  }
  // lanterns on hooks; a green ribbon on a finished one
  if(p.st==='ask'||p.st==='done'||p.st==='broke') hang(p.x+p.W*2-(p.st==='broke'?22:24),p.y+hpx,p.st);
  if(p.st==='done'){const rx=p.x+p.W*2-44;div('a',rx,p.y,'width:8px;height:24px;background:#5e9a4c;box-shadow:inset 2px 0 #7fc26a,inset -2px 0 #3f6e35');div('a',rx-1,p.y+9,'width:10px;height:7px;background:#46793a');div('a',rx+1,p.y+24,'width:3px;height:12px;background:#5e9a4c');div('a',rx+5,p.y+24,'width:3px;height:9px;background:#4c8240')}
  if(pt&&p.id==='a'){
    div('glow',p.x-20,p.y-20,'width:'+(p.W*2+40)+'px;height:70px;background:radial-gradient(ellipse,rgba(255,170,70,.2),rgba(255,170,70,0) 70%)');
  }
});
// a bare hook at the end of the row: a new workspace
im('peg.png',hookX,58,8,5,dim(.6));
div('a',hookX+2,63,'width:2px;height:8px;background:#2e2016');div('a',hookX+2,70,'width:7px;height:2px;background:#2e2016');div('a',hookX+8,66,'width:2px;height:6px;background:'+(pt?'#f2c66d':'#2e2016'));
// pointing at 71880: its ticket and merge request, on a small parchment hung from it
if(pt){
  const a=at.a, tx=a.x-6, ty=2;
  [tx+30,tx+300].forEach(cx=>{div('a',cx,ty+44,'width:2px;height:'+(a.y-ty-44)+'px;background:#6f5a44')});
  im('tag170.png',tx,ty,170,22,'filter:brightness(.85) sepia(.2)');
  div('ink',tx+16,ty+5,'font:700 12px/14px MenderHand;color:#33200f;white-space:nowrap','BE: Cost basis export drops lots bought on a split day');
  div('ink',tx+16,ty+23,'font:400 11px/14px MenderHand;color:#5a3d1c;white-space:nowrap','in review · !477 passed · 2 of 2 approved · 1 comment');
}
if(open){
  const o=at.own, sx=o.x-8, sy=172;
  [o.x+20,o.x+o.W*2-24].forEach(cx=>{for(let y=o.y+32;y<sy+4;y+=6)div('a',cx,y,'width:2px;height:4px;background:'+(y%12?'#6f5a44':'#2e2016'))});
  sheets(sx,sy);
}
document.body.dataset.ready=1;
})();
</script></body></html>
